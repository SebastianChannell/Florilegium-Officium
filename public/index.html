<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070606">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Officium">
  <title>Officium · Sacrum Florilegium</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <details class="florilegium-menu">
        <summary>
          <span>Sites</span>
          <span class="florilegium-menu-chevron" aria-hidden="true"></span>
        </summary>
        <nav aria-label="Sacrum Florilegium sites">
          <p>Sacrum Florilegium</p>
          <a href="https://sacrumflorilegium.com/">Domus</a>
          <a href="https://biblia.sacrumflorilegium.com/">Biblia</a>
          <a href="https://librarium.sacrumflorilegium.com/">Librarium</a>
          <a href="https://officium.sacrumflorilegium.com/" aria-current="page">Officium</a>
          <a href="https://orarium.sacrumflorilegium.com/">Orarium</a>
          <a href="https://propria.sacrumflorilegium.com/">Propria</a>
        </nav>
      </details>
      <div class="brand">OFFICIUM</div>
      <div class="date-nav" aria-label="Date navigation">
        <button id="prevDay" class="icon-button" type="button" aria-label="Previous day">‹</button>
        <button id="dateButton" class="date-button" type="button" aria-expanded="true" aria-controls="dateControls">
          <span id="weekday"></span>
          <span class="date-button-line">
            <strong id="displayDate"></strong>
            <span class="date-controls-chevron" aria-hidden="true"></span>
          </span>
        </button>
        <button id="nextDay" class="icon-button" type="button" aria-label="Next day">›</button>
      </div>

      <div id="dateControls" class="date-controls">
        <label class="date-picker-control">
          <span>Choose date</span>
          <input id="datePicker" type="date" aria-label="Choose date">
        </label>

        <nav id="hourNav" class="hour-nav" aria-label="Canonical hours"></nav>

        <div id="matinsTools" class="matins-tools" hidden>
          <button id="lessonsToggle" type="button" aria-pressed="false">Lessons only</button>
        </div>

        <fieldset class="supplementary-prayer-controls" aria-label="Prayers before and after the Office">
          <legend class="visually-hidden">Prayers before and after the Office</legend>
          <label>
            <input id="anteToggle" type="checkbox">
            <span id="anteToggleLabel">Ante Officium</span>
          </label>
          <label>
            <input id="postToggle" type="checkbox">
            <span id="postToggleLabel">Post Officium</span>
          </label>
        </fieldset>

        <div class="reader-controls">
          <label class="version-control">
            <span class="visually-hidden">Second language</span>
            <select id="languageSelect" aria-label="Second language">
              <option value="English">Latin · English</option>
              <option value="Cantilenae-English">Cantilenæ · English</option>
              <option value="Espanol">Latín · Español</option>
            </select>
          </label>
          <label class="version-control">
            <span class="visually-hidden">Rubrics</span>
            <select id="versionSelect" aria-label="Rubrics">
              <option value="1939">Divino Afflatu · 1939</option>
              <option value="1954">Divino Afflatu · 1954</option>
              <option value="1955">Reduced · 1955</option>
              <option value="1960">Rubrics · 1960</option>
            </select>
          </label>
          <div class="font-controls" aria-label="Text size">
            <button id="fontDown" type="button" aria-label="Decrease text size">A−</button>
            <button id="fontUp" type="button" aria-label="Increase text size">A+</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="status" class="status" role="status">Loading the Office…</div>
      <section id="antePrayer" class="supplementary-prayer" aria-label="Prayer before the Divine Office" hidden></section>
      <article id="officeContent" class="office-content" aria-live="polite"></article>
      <section id="postPrayer" class="supplementary-prayer" aria-label="Prayer after the Divine Office" hidden></section>
    </main>

    <footer>
      Liturgical text and computation: Divinum Officium Project.
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/gh/DivinumOfficium/divinum-officium@ed3a06a61e58d12779ca6ffb4bbeacbbfe4b2313/web/www/js/util.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/DivinumOfficium/divinum-officium@ed3a06a61e58d12779ca6ffb4bbeacbbfe4b2313/web/www/js/exsurge.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
