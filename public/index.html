<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070606">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Officium">
  <title>Officium · Sacrum Florilegium</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">OFFICIUM</div>
      <div class="date-nav" aria-label="Date navigation">
        <button id="prevDay" class="icon-button" type="button" aria-label="Previous day">‹</button>
        <button id="dateButton" class="date-button" type="button">
          <span id="weekday"></span>
          <strong id="displayDate"></strong>
        </button>
        <button id="nextDay" class="icon-button" type="button" aria-label="Next day">›</button>
        <input id="datePicker" class="visually-hidden" type="date" aria-label="Choose date">
      </div>

      <nav id="hourNav" class="hour-nav" aria-label="Canonical hours"></nav>

      <div class="reader-controls">
        <label class="version-control">
          <span class="visually-hidden">Rubrics</span>
          <select id="versionSelect" aria-label="Rubrics">
            <option value="1939">Divino Afflatu · 1939</option>
            <option value="1954">Divino Afflatu · 1954</option>
            <option value="1955">Reduced · 1955</option>
            <option value="1960">Rubrics · 1960</option>
          </select>
        </label>
        <div class="font-controls" aria-label="Text size">
          <button id="fontDown" type="button" aria-label="Decrease text size">A−</button>
          <button id="fontUp" type="button" aria-label="Increase text size">A+</button>
        </div>
      </div>
    </header>

    <main>
      <section id="dayHeadline" class="day-headline" aria-live="polite"></section>
      <div id="status" class="status" role="status">Loading the Office…</div>
      <article id="officeContent" class="office-content" aria-live="polite"></article>
    </main>

    <footer>
      Liturgical text and computation: Divinum Officium Project.
    </footer>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
