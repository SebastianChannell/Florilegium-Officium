name: Sync Divinum Officium data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-divinum-officium.yml'
      - 'scripts/**'
      - 'functions/**'
      - 'public/app.js'
      - 'public/index.html'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-office-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check upstream and coverage
        id: check
        run: |
          set -euo pipefail
          upstream_sha=$(git ls-remote https://github.com/DivinumOfficium/divinum-officium.git refs/heads/master | awk '{print $1}')
          [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          UPSTREAM_SHA="$upstream_sha" node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          let manifest;
          try { manifest = JSON.parse(readFileSync('public/data/office/available.json', 'utf8')); } catch {}
          const date = new Date();
          date.setUTCDate(date.getUTCDate() + 60);
          const requiredEnd = date.toISOString().slice(0, 10);
          const today = new Date().toISOString().slice(0, 10);
          const changed = manifest?.source.commit !== process.env.UPSTREAM_SHA || manifest.start > today || manifest.end < requiredEnd;
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          JS
      - name: Install Perl requirements
        if: steps.check.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcgi-pm-perl liburi-perl libhtml-parser-perl
      - name: Check out the checked upstream commit
        if: steps.check.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.sha }}
        run: |
          git init "$RUNNER_TEMP/divinum-officium"
          git -C "$RUNNER_TEMP/divinum-officium" remote add origin https://github.com/DivinumOfficium/divinum-officium.git
          git -C "$RUNNER_TEMP/divinum-officium" fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/divinum-officium" checkout --detach FETCH_HEAD
      - name: Generate 90 days from the official engine
        if: steps.check.outputs.changed == 'true'
        run: npm run sync:offices -- --source "$RUNNER_TEMP/divinum-officium" --start "$(date -u -d '7 days ago' +%F)" --days 97 --force true
      - name: Verify data and reader
        if: steps.check.outputs.changed == 'true'
        run: |
          npm test
          npm run verify:data
      - name: Commit verified data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/office
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh generated Divinum Officium Hours'
            git push
          fi
      - name: Record result
        env:
          UPSTREAM_SHA: ${{ steps.check.outputs.sha }}
          CHANGED: ${{ steps.check.outputs.changed }}
        run: |
          echo "Upstream: $UPSTREAM_SHA; regeneration required: $CHANGED" >> "$GITHUB_STEP_SUMMARY"
